name: Production Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACR_NAME: acrcardcanvasprod.azurecr.io
  RESOURCE_GROUP: rg-cardcanvas-prod
  VM_FRONTEND_NAME: vm-cc-frontend
  VM_BACKEND_NAME: vm-cc-backend

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Backend Checks
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cardcanvas-backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Backend Cargo Check
        run: |
          cd cardcanvas-backend
          cargo check --release

      # Frontend Checks
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cardcanvas-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd cardcanvas-frontend
          npm ci

      - name: Run Frontend Lint & Build Check
        run: |
          cd cardcanvas-frontend
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080 # Dummy build env URL

  build-and-push:
    name: Build & Push Containers to ACR
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # Build and Push Backend
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./cardcanvas-backend
          file: ./cardcanvas-backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}/backend:${{ github.sha }}
            ${{ env.ACR_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Frontend
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./cardcanvas-frontend
          file: ./cardcanvas-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}/frontend:${{ github.sha }}
            ${{ env.ACR_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Private VMs via Azure Run Command
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy Backend (runs inside VNet, no public IP/SSH required)
      - name: Deploy Backend VM Container
        run: |
          az vm run-command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.VM_BACKEND_NAME }} \
            --command-id RunShellScript \
            --scripts "
              # Ensure ACR helper can login
              az acr login --name ${{ env.ACR_NAME }}
              
              # Stop and remove existing container if running
              docker stop cardcanvas-backend || true
              docker rm cardcanvas-backend || true
              
              # Pull the newly compiled container
              docker pull ${{ env.ACR_NAME }}/backend:${{ github.sha }}
              
              # Start the service
              docker run -d \
                --name cardcanvas-backend \
                --restart always \
                -p 8080:8080 \
                -v /var/www/cardcanvas-backend/uploads:/app/uploads \
                --env-file /var/www/cardcanvas-backend/.env \
                ${{ env.ACR_NAME }}/backend:${{ github.sha }}
            "

      # Deploy Frontend (runs inside VNet behind Application Gateway, no public SSH required)
      - name: Deploy Frontend VM Container
        run: |
          az vm run-command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.VM_FRONTEND_NAME }} \
            --command-id RunShellScript \
            --scripts "
              # Ensure ACR helper can login
              az acr login --name ${{ env.ACR_NAME }}
              
              # Stop and remove existing container if running
              docker stop cardcanvas-frontend || true
              docker rm cardcanvas-frontend || true
              
              # Pull the newly compiled container
              docker pull ${{ env.ACR_NAME }}/frontend:${{ github.sha }}
              
              # Start the service
              docker run -d \
                --name cardcanvas-frontend \
                --restart always \
                -p 80:3000 \
                -e NEXT_PUBLIC_API_URL=http://10.0.2.4:8080 \
                ${{ env.ACR_NAME }}/frontend:${{ github.sha }}
            "
