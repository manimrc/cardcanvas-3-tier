# Sleekly Production Log Rotation Configuration
# Place this in /etc/logrotate.d/sleekly

/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 `cat /var/run/nginx.pid`
        fi
    endscript
}

/var/log/sleekly-backend/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 azureuser azureuser
    sharedscripts
    postrotate
        # Since systemd keeps file descriptors open when using standard redirect (StandardOutput=append:...),
        # we trigger systemd to reload or we restart the service.
        # Alternatively, if running under Docker, the logs are managed by Docker daemon.
        systemctl reload sleekly-backend >/dev/null 2>&1 || systemctl restart sleekly-backend >/dev/null 2>&1
    endscript
}
